name: Validate and deploy Sparkfolio

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and browser
        run: npm ci
      - name: Validate, build and test the production site
        # Use the runner's AppArmor-supported Chrome installation with its sandbox.
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: npm run check
      - name: Save browser evidence and local timing baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit
          path: .audit/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
