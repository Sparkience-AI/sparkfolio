name: Release candidate evidence

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: npm run check
      - run: npm run test:mcp

  evidence:
    needs: preflight
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: Sparkience-AI/.github/.github/workflows/reusable-node-release.yml@89f2cee919281a300c960fba3d8a8a124f1a61d0
    with:
      node-version: "24"
      artifact-name: sparkfolio-release-candidate
      expected-version: "0.1.0"
      enable-attestations: true
      retention-days: 14
